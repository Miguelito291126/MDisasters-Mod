# Configuration file

general {

    ##########################################################################################################
    # tsunami
    #--------------------------------------------------------------------------------------------------------#
    # Configuración de Tsunamis
    ##########################################################################################################

    tsunami {
        # Velocidad a la que va
        # Min: 0.0
        # Max: 200.0
        D:speed=0.35

        # Grosor/Fondo de la ola
        # Min: 1
        # Max: 10
        I:waveDepth=2

        # Altura de la ola de agua en bloques
        # Min: 1
        # Max: 50
        I:waveHeight=10

        # Ancho frontal de la ola en bloques
        # Min: 5
        # Max: 200
        I:waveWidth=80
    }

    ##########################################################################################################
    # tornado
    #--------------------------------------------------------------------------------------------------------#
    # Configuración de Tornados
    ##########################################################################################################

    tornado {
        # Velocidad Maxima a la que va
        # Min: 0.0
        # Max: 200.0
        D:maxSpeed=0.4

        # Velocidad a la que va
        # Min: 0.0
        # Max: 200.0
        D:speed=0.2

        # Tiempo que dura el tornado (en ticks: 20 ticks = 1 segundo)
        # Min: 20
        # Max: 72000
        I:tornadoDuration=800

        # Altura del tornado en bloques
        # Min: 5
        # Max: 150
        I:tornadoHeight=30

        # Ancho/Radio del tornado en bloques
        # Min: 1
        # Max: 150
        I:tornadoWidth=30
    }

    ##########################################################################################################
    # meteor
    #--------------------------------------------------------------------------------------------------------#
    # Configuración de Meteoros
    ##########################################################################################################

    meteor {
        # Potencia de la explosión
        # Min: 0.0
        # Max: 500.0
        D:explosionPower=10.0

        # Radio del cráter provocado por el impacto
        # Min: 0
        # Max: 500
        I:explosionRadius=20

        # Distancia de aparición sobre el objetivo
        # Min: 5
        # Max: 500
        I:meteorDistance=80

        # Altura física del meteorito
        # Min: 0.1
        # Max: 500.0
        D:meteorHeight=1.5

        # Anchura física del meteorito
        # Min: 0.1
        # Max: 500.0
        D:meteorWidth=1.5

        # Velocidad de caída
        # Min: 0.1
        # Max: 200.0
        D:speed=1.0
    }

    ##########################################################################################################
    # spawner
    #--------------------------------------------------------------------------------------------------------#
    # Configuración del Spawner Aleatorio
    ##########################################################################################################

    spawner {
        # Habilita o deshabilita la generación automática de desastres en el mundo.
        B:enableSpawner=true

        # Probabilidad de generación aleatoria (en ticks). Menor número = Más frecuente.
        # Min: 200
        # Max: 100000
        I:spawnChance=12000
    }

    ##########################################################################################################
    # earthquake
    #--------------------------------------------------------------------------------------------------------#
    # Configuración de Terremotos
    ##########################################################################################################

    earthquake {
        # Tiempo que dura el terremoto (en ticks: 20 ticks = 1 segundo)
        # Min: 20
        # Max: 72000
        I:earthquakeDuration=600

        # Magnitud del terremoto (Escala Richter 1.0 - 10.0)
        # Min: 1.0
        # Max: 10.0
        D:earthquakeMagnitude=10.0

        # Radio Máximo de afectación en bloques
        # Min: 1
        # Max: 500
        I:earthquakeMaxRadius=120
    }

    ##########################################################################################################
    # flood
    #--------------------------------------------------------------------------------------------------------#
    # Configuración de Inundaciones
    ##########################################################################################################

    flood {
        # Si el agua se expande indefinidamente
        B:infiniteWaterExpansion=true

        # Radio máximo
        # Min: 1.0
        # Max: 1000.0
        D:waterMaxRadius=100.0

        # Velocidad de expansión
        # Min: 0.01
        # Max: 10.0
        D:waterSpeed=0.4
    }

    ##########################################################################################################
    # volcano
    #--------------------------------------------------------------------------------------------------------#
    # Configuración de Inundaciones
    ##########################################################################################################

    volcano {
        # Velocidad de presion
        # Min: 0.01
        # Max: 20.0
        D:Speed=0.05
    }

}


